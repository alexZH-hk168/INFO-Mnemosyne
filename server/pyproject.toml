[project]
name = "mnemosyne-server"
version = "0.1.0"
description = "Mnemosyne backend (FastAPI)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pymupdf>=1.26,<1.27",  # 与前端 F4 量 bbox 用的 1.26.4 同一系列；2.x 会拉入 onnxruntime 等版面模型依赖
  "python-pptx>=1.0",
  "sqlite-vec>=0.1.6",
  "httpx>=0.27",
  "mcp>=2.3,<3",  # B3b 插件运行时：官方 MCP Python SDK（MIT）；uv.lock 待编排补锁（U95）
  "trafilatura>=2.0",  # B2 网页正文抽取，Apache-2.0；uv.lock 待编排更新（U76）
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
